# Matt's Garden Observatory — EXAMPLE production configuration.
#
# This file is an EXAMPLE only. It is tracked in Git purely to document the
# intended production shape. Do NOT edit it in place for a real deployment and
# do NOT commit a real production configuration.
#
# To deploy, copy this file OUTSIDE the repository — the canonical external
# location is:
#
#     /etc/garden-observatory/mgo.toml
#
# owned root:mgo with mode 0640, so the dedicated runtime account can read its
# configuration but can never rewrite it. `scripts/deploy/install-service-
# identity.sh` seeds that file from this example on a first install and never
# overwrites an existing one.
#
# The service is then pointed at it by the systemd unit's environment selector:
#
#     Environment=MGO_CONFIG_PATH=/etc/garden-observatory/mgo.toml
#
# The paths below are the canonical production layout (see
# docs/Service-Identity.md). All persistent application data lives under
# /var/lib/garden-observatory, owned by the "mgo" runtime account — never in an
# operator's home directory. Replace hosts and thresholds to match the target
# machine.

[application]
name = "Matt's Garden Observatory"
environment = "production"
host = "0.0.0.0"
port = 8080

[storage]
data_directory = "/var/lib/garden-observatory"
log_directory = "/var/log/garden-observatory"
database_path = "/var/lib/garden-observatory/db/mgo.db"

[camera]
enabled = true
# Camera backend, shared by detection, capture and preview:
#   "rpicam"    — physical Raspberry Pi camera through the rpicam-* tools
#   "libcamera" — physical camera through the legacy libcamera-* tools
#   "simulator" — deterministic generated imagery; NO physical camera
#   "null"/"none" — deliberately unavailable; never produces an image
# Production must stay on a physical backend. "simulator" is a development aid
# only: its output is drawn in memory, is not wildlife evidence, must never be
# entered into Matt's Viewings, and proves nothing about the real camera.
backend = "rpicam"
detection_interval_seconds = 60
capture_directory = "/var/lib/garden-observatory/media/captures"

[preview]
# Live camera preview. Preview shares the camera with capture; only one may own
# it at a time and capture always takes priority. Enable when a preview
# consumer is in use.
enabled = true
width = 1280
height = 720
fps = 15
startup_timeout_seconds = 5.0
shutdown_timeout_seconds = 5.0

[motion]
# Motion detection foundation. It shares the live preview stream (no second
# camera process) and detects SCENE CHANGE only — it does not recognise birds
# or any other object, and it never triggers a still capture automatically.
# Motion is measured frame-to-frame (each frame vs the previous analysed frame),
# so it reports recent visual activity rather than presence; ordinary garden
# movement (wind, leaves, birds) may legitimately trigger it.
#
# Left DISABLED here: production enablement happens only during an explicit
# Raspberry Pi validation step. When enabling it, also enable [preview] so the
# monitor has a frame source; otherwise it stays truthfully in
# "waiting_for_frames".
enabled = false
analysis_interval_seconds = 1.0
analysis_width = 160
analysis_height = 90
pixel_difference_threshold = 20
# Default 0.08 is based on real IMX708 production measurements; tune per site.
changed_pixel_ratio_threshold = 0.08
cooldown_seconds = 5.0

[notifications]
# Notification framework foundation. Only the transport-free providers exist so
# far: "log" (application log, for validation) and "null" (discard). Real
# transports (Telegram/email) are future work — no tokens or SMTP settings
# belong here yet. Left DISABLED here; production enablement happens only
# during an explicit validation step.
enabled = false
provider = "log"

[database]
# SQLite runtime settings. The database FILE is [storage].database_path above —
# /var/lib/garden-observatory/db/mgo.db, inside the state directory owned by the
# "mgo" runtime account (see docs/Service-Identity.md). Its WAL and shm sidecars
# are written alongside it, so that directory must stay writable by the service.
#
# The schema is versioned and migrated automatically at startup; a database
# newer than the running build is refused rather than opened. See
# docs/Database.md.
health_check_interval_seconds = 60
# Bounded wait for a competing writer's lock. Five seconds comfortably covers
# the short transactions this application makes on SD-card storage.
busy_timeout_seconds = 5.0

[health]
enabled = true
collection_interval_seconds = 60
temperature_warning_celsius = 70.0
temperature_critical_celsius = 80.0
disk_warning_percent = 80.0
disk_critical_percent = 90.0
memory_warning_percent = 85.0
memory_critical_percent = 95.0
