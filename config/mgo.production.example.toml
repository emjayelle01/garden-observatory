# Matt's Garden Observatory — EXAMPLE production configuration.
#
# This file is an EXAMPLE only. It is tracked in Git purely to document the
# intended production shape. Do NOT edit it in place for a real deployment and
# do NOT commit a real production configuration.
#
# To deploy, copy this file OUTSIDE the repository — the canonical external
# location is:
#
#     /etc/garden-observatory/mgo.toml
#
# owned root:mgo with mode 0640, so the dedicated runtime account can read its
# configuration but can never rewrite it. `scripts/deploy/install-service-
# identity.sh` seeds that file from this example on a first install and never
# overwrites an existing one.
#
# The service is then pointed at it by the systemd unit's environment selector:
#
#     Environment=MGO_CONFIG_PATH=/etc/garden-observatory/mgo.toml
#
# The paths below are the canonical production layout (see
# docs/Service-Identity.md). All persistent application data lives under
# /var/lib/garden-observatory, owned by the "mgo" runtime account — never in an
# operator's home directory. Replace hosts and thresholds to match the target
# machine.

[application]
name = "Matt's Garden Observatory"
environment = "production"
host = "0.0.0.0"
port = 8080

[storage]
data_directory = "/var/lib/garden-observatory"
log_directory = "/var/log/garden-observatory"
database_path = "/var/lib/garden-observatory/db/mgo.db"

[camera]
enabled = true
# Camera backend, shared by detection, capture and preview:
#   "rpicam"    — physical Raspberry Pi camera through the rpicam-* tools
#   "libcamera" — physical camera through the legacy libcamera-* tools
#   "simulator" — deterministic generated imagery; NO physical camera
#   "null"/"none" — deliberately unavailable; never produces an image
# Production must stay on a physical backend. "simulator" is a development aid
# only: its output is drawn in memory, is not wildlife evidence, must never be
# entered into Matt's Viewings, and proves nothing about the real camera.
backend = "rpicam"
detection_interval_seconds = 60
capture_directory = "/var/lib/garden-observatory/media/captures"

[preview]
# Live camera preview. Preview shares the camera with capture; only one may own
# it at a time and capture always takes priority. Enable when a preview
# consumer is in use.
enabled = true
# Managed preview lifecycle — left OFF in this tracked example on purpose, so
# copying it changes nothing about how an existing deployment behaves.
#
# auto_start: one attempt to start preview during application startup (survives
# `systemctl restart mgo.service` and a reboot without an operator request).
# restore_after_capture: restart preview after a still capture, but only if it
# was RUNNING when that capture began.
#
# An ACCEPTED production deployment may explicitly set BOTH to true in its own
# external configuration at /etc/garden-observatory/mgo.toml — that is the
# configuration the physical camera acceptance run in docs/Camera-Acceptance.md
# tests. Enabling them here is not how that happens: this file is an example
# only. To roll back, set both to false and restart mgo.service.
auto_start = false
restore_after_capture = false
width = 1280
height = 720
fps = 15
startup_timeout_seconds = 5.0
shutdown_timeout_seconds = 5.0

[motion]
# Motion detection foundation. It shares the live preview stream (no second
# camera process) and detects SCENE CHANGE only — it does not recognise birds
# or any other object. It takes no picture itself; a material transition may
# optionally drive one through [event_capture] below, which is also disabled.
# Motion is measured frame-to-frame (each frame vs the previous analysed frame),
# so it reports recent visual activity rather than presence; ordinary garden
# movement (wind, leaves, birds) may legitimately trigger it.
#
# Left DISABLED here: production enablement happens only during an explicit
# Raspberry Pi validation step. When enabling it, also enable [preview] so the
# monitor has a frame source; otherwise it stays truthfully in
# "waiting_for_frames".
enabled = false
analysis_interval_seconds = 1.0
analysis_width = 160
analysis_height = 90
pixel_difference_threshold = 20
# Default 0.08 is based on real IMX708 production measurements; tune per site.
changed_pixel_ratio_threshold = 0.08
cooldown_seconds = 5.0

[event_capture]
# Motion-triggered still capture (Task 13.1). When enabled, a material
# transition into motion_detected may cause ONE full-resolution still through
# the existing camera coordinator, catalogued with the motion facts behind it.
# motion_detected still means SCENE CHANGE, not bird presence — and so does an
# automatic capture. There is no detection, classification or species here.
#
# The pipeline WAS validated against the physical camera on 2026-08-12 (Task
# 13.2): real motion produced full-resolution stills, correctly attributed and
# correlated, with preview released and restored each time and one camera owner
# throughout. It still stays DISABLED here, and that is not caution left over
# from before validation — it is the retention problem. There is NO retention or
# deletion policy, and across the 341-second enabled window ambient garden motion
# alone produced 17 captures totalling 42,660,151 bytes under
# [camera].capture_directory — about 3.0 captures per minute and about 7.5 MB per
# minute of JPEG payload, with nothing to reclaim it. That is one short window's
# measurement, not a long-term average; long-term unattended behaviour is
# unproven. Turning this on for an unattended period is a separate operating
# decision that needs retention answered first.
#
# Enabling it requires camera.enabled, preview.enabled, preview.auto_start,
# preview.restore_after_capture and motion.enabled to all be true; asking for it
# with any of them off is rejected at load time. See docs/Event-Capture.md.
enabled = false

[retention]
# Capture-media retention (Task 14.1). This is the SOFTWARE FOUNDATION for
# reclaiming captured media safely. It is not an operating policy, and enabling
# it here is not authorised by Task 14.1.
#
# Left DISABLED. Disabled means no filesystem mutation and no database mutation
# of any kind: no lifecycle row, no deletion, no recovery of an interrupted
# deletion, no observation.
#
# Nothing schedules retention. There is no interval, no systemd timer, no
# startup or shutdown deletion and no destructive HTTP endpoint;
# GET /retention/status is read-only and inert. How retention is invoked
# operationally is a separate, later decision.
#
# Task 14.1 has had NO physical validation: no deletion has been performed
# against this host, this database or this media directory. It also does not
# make the event-capture pipeline ready for permanent unattended enablement —
# [event_capture] above stays disabled, and long-term unattended behaviour
# remains unproven.
#
# Only origin = "motion" captures are managed. Manual captures, captures with no
# origin and captures from any unrecognised origin are PROTECTED.
enabled = false
# The two destructive bounds are deliberately left commented. The production
# retention period and storage budget have NOT been decided, and a value written
# here would read as an accepted operating policy. At least one of them is
# required when enabled = true; enabling with neither is rejected at load time.
# max_age_days = 30
# max_managed_bytes = 2147483648
# Safety bounds. The newest minimum_keep_count managed captures are preserved
# unconditionally and the floor is never broken to meet a byte target;
# max_deletions_per_run bounds how many captures one run may newly select.
# See docs/Retention.md.
minimum_keep_count = 100
max_deletions_per_run = 25

[notifications]
# Notification framework foundation. Only the transport-free providers exist so
# far: "log" (application log, for validation) and "null" (discard). Real
# transports (Telegram/email) are future work — no tokens or SMTP settings
# belong here yet. Left DISABLED here; production enablement happens only
# during an explicit validation step.
enabled = false
provider = "log"

[database]
# SQLite runtime settings. The database FILE is [storage].database_path above —
# /var/lib/garden-observatory/db/mgo.db, inside the state directory owned by the
# "mgo" runtime account (see docs/Service-Identity.md). Its WAL and shm sidecars
# are written alongside it, so that directory must stay writable by the service.
#
# The schema is versioned and migrated automatically at startup; a database
# newer than the running build is refused rather than opened. See
# docs/Database.md.
health_check_interval_seconds = 60
# Bounded wait for a competing writer's lock. Five seconds comfortably covers
# the short transactions this application makes on SD-card storage.
busy_timeout_seconds = 5.0

[health]
enabled = true
collection_interval_seconds = 60
temperature_warning_celsius = 70.0
temperature_critical_celsius = 80.0
disk_warning_percent = 80.0
disk_critical_percent = 90.0
memory_warning_percent = 85.0
memory_critical_percent = 95.0
