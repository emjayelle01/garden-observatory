# Matt's Garden Observatory — EXAMPLE production configuration.
#
# This file is an EXAMPLE only. It is tracked in Git purely to document the
# intended production shape. Do NOT edit it in place for a real deployment and
# do NOT commit a real production configuration.
#
# To deploy, copy this file OUTSIDE the repository — the intended external
# location is:
#
#     /etc/mgo/mgo.toml
#
# then point the service at it with the environment selector:
#
#     MGO_CONFIG_PATH=/etc/mgo/mgo.toml
#
# The values below are safe, illustrative production defaults. Replace hosts,
# paths and thresholds to match the target machine.

[application]
name = "Matt's Garden Observatory"
environment = "production"
host = "0.0.0.0"
port = 8080

[storage]
data_directory = "/home/pi/Projects/garden-observatory/data"
log_directory = "/home/pi/Projects/garden-observatory/logs"
database_path = "/home/pi/Projects/garden-observatory/data/mgo.db"

[camera]
enabled = true
backend = "rpicam"
detection_interval_seconds = 60
capture_directory = "/home/pi/Projects/garden-observatory/data/captures"

[preview]
# Live camera preview. Preview shares the camera with capture; only one may own
# it at a time and capture always takes priority. Enable when a preview
# consumer is in use.
enabled = true
width = 1280
height = 720
fps = 15
startup_timeout_seconds = 5.0
shutdown_timeout_seconds = 5.0

[motion]
# Motion detection foundation. It shares the live preview stream (no second
# camera process) and detects SCENE CHANGE only — it does not recognise birds
# or any other object, and it never triggers a still capture automatically.
# Motion is measured frame-to-frame (each frame vs the previous analysed frame),
# so it reports recent visual activity rather than presence; ordinary garden
# movement (wind, leaves, birds) may legitimately trigger it.
#
# Left DISABLED here: production enablement happens only during an explicit
# Raspberry Pi validation step. When enabling it, also enable [preview] so the
# monitor has a frame source; otherwise it stays truthfully in
# "waiting_for_frames".
enabled = false
analysis_interval_seconds = 1.0
analysis_width = 160
analysis_height = 90
pixel_difference_threshold = 20
# Default 0.08 is based on real IMX708 production measurements; tune per site.
changed_pixel_ratio_threshold = 0.08
cooldown_seconds = 5.0

[health]
enabled = true
collection_interval_seconds = 60
temperature_warning_celsius = 70.0
temperature_critical_celsius = 80.0
disk_warning_percent = 80.0
disk_critical_percent = 90.0
memory_warning_percent = 85.0
memory_critical_percent = 95.0
