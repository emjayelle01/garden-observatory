[application]
name = "Matt's Garden Observatory"
environment = "development"
host = "0.0.0.0"
port = 8080

[storage]
data_directory = "data"
log_directory = "logs"
database_path = "data/mgo.db"

[camera]
# Camera functionality is disabled by default. No hardware is assumed to
# exist and no capture is attempted until this is explicitly enabled.
enabled = false
# Detection backend: "rpicam", "libcamera", "null"/"none".
backend = "rpicam"
# Optional preferred device index; leave unset for no preference.
# device_index = 0
detection_interval_seconds = 60
capture_directory = "data/captures"

[preview]
# Live camera preview. Disabled by default: no preview process is started until
# this is explicitly enabled. Preview shares the camera with capture — only one
# may own it at a time, and capture always takes priority.
enabled = false
width = 1280
height = 720
fps = 15
# Bounds for confirming process start and for graceful shutdown before a
# forced kill (seconds).
startup_timeout_seconds = 5.0
shutdown_timeout_seconds = 5.0

[motion]
# Motion detection is disabled by default: no frames are consumed and no
# analysis runs until this is explicitly enabled. Motion detection shares the
# live preview stream (it never starts a second camera process) and detects
# scene change only — it does not recognise birds or any other object.
#
# Motion is measured frame-to-frame: each analysed frame is compared with the
# PREVIOUS analysed frame, so "motion" means recent visual activity, not a
# departure from a fixed quiet scene. A lasting change settles back to no_motion
# once it stops changing; ordinary garden movement (wind, leaves, birds) may
# legitimately trigger it.
enabled = false
# How often a frame is analysed (seconds). Deliberately far slower than the
# preview frame rate.
analysis_interval_seconds = 1.0
# Small resolution frames are reduced to before comparison (bounds CPU/memory).
analysis_width = 160
analysis_height = 90
# Per-pixel luminance change (0–255) below which a pixel is treated as noise.
pixel_difference_threshold = 20
# Proportion of changed pixels (0–1) above which the frame-to-frame change is
# "motion". Default 0.08 is based on real IMX708 production measurements (above
# quiet-scene variation, below clear controlled motion); per-site tuning may
# still be needed.
changed_pixel_ratio_threshold = 0.08
# Suppresses recording a repeated motion event that restarts within this window
# (seconds); the eventual return to no-motion is never hidden.
cooldown_seconds = 5.0

[notifications]
# Notification framework. Disabled by default: no provider is constructed and
# every published event is dropped until this is explicitly enabled. Only the
# transport-free providers exist so far — "log" (writes events to the
# application log, for validation) and "null" (accepts and discards events).
# Telegram/email/SMS are future work; their settings do NOT belong here yet.
enabled = false
provider = "log"

[health]
enabled = true
collection_interval_seconds = 60
temperature_warning_celsius = 70.0
temperature_critical_celsius = 80.0
disk_warning_percent = 80.0
disk_critical_percent = 90.0
memory_warning_percent = 85.0
memory_critical_percent = 95.0
