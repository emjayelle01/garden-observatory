[application]
name = "Matt's Garden Observatory"
environment = "development"
host = "0.0.0.0"
port = 8080

[storage]
data_directory = "data"
log_directory = "logs"
database_path = "data/mgo.db"

[camera]
# Camera functionality is disabled by default. No hardware is assumed to
# exist and no capture is attempted until this is explicitly enabled.
enabled = false
# Camera backend, shared by detection, capture and preview:
#   "rpicam"    — physical Raspberry Pi camera through the rpicam-* tools
#   "libcamera" — physical camera through the legacy libcamera-* tools
#   "simulator" — deterministic generated imagery; NO physical camera. Opt-in,
#                 for development without hardware. Simulated captures are not
#                 wildlife evidence. See docs/Camera-Simulator.md.
#   "null"/"none" — deliberately unavailable; never produces an image
backend = "rpicam"
# Optional preferred device index; leave unset for no preference.
# device_index = 0
detection_interval_seconds = 60
capture_directory = "data/captures"

[preview]
# Live camera preview. Disabled by default: no preview process is started until
# this is explicitly enabled. Preview shares the camera with capture — only one
# may own it at a time, and capture always takes priority.
enabled = false
# Managed preview lifecycle. Both policies are OFF here and stay off unless a
# deployment explicitly asks for them in its own configuration file; with both
# false the behaviour is exactly the manual one described above.
#
# auto_start: make ONE attempt to start preview during application startup, so
# the camera pipeline survives a service restart or a reboot without an operator
# calling POST /camera/preview/start. There is no retry loop: a failed attempt
# leaves preview truthfully "failed" and the API keeps serving.
auto_start = false
# restore_after_capture: if preview was RUNNING when a still capture began,
# restart it once that capture attempt finishes. A preview that was stopped
# stays stopped — a capture never starts a preview nobody asked for. The
# capture's own result is always the answer: a restoration failure never turns a
# successful capture into an error (see docs/Camera-Acceptance.md).
restore_after_capture = false
# Both policies require preview.enabled = true and camera.enabled = true;
# asking for one with either disabled is rejected at load time.
width = 1280
height = 720
fps = 15
# Bounds for confirming process start and for graceful shutdown before a
# forced kill (seconds).
startup_timeout_seconds = 5.0
shutdown_timeout_seconds = 5.0

[motion]
# Motion detection is disabled by default: no frames are consumed and no
# analysis runs until this is explicitly enabled. Motion detection shares the
# live preview stream (it never starts a second camera process) and detects
# scene change only — it does not recognise birds or any other object.
#
# Motion is measured frame-to-frame: each analysed frame is compared with the
# PREVIOUS analysed frame, so "motion" means recent visual activity, not a
# departure from a fixed quiet scene. A lasting change settles back to no_motion
# once it stops changing; ordinary garden movement (wind, leaves, birds) may
# legitimately trigger it.
enabled = false
# How often a frame is analysed (seconds). Deliberately far slower than the
# preview frame rate.
analysis_interval_seconds = 1.0
# Small resolution frames are reduced to before comparison (bounds CPU/memory).
analysis_width = 160
analysis_height = 90
# Per-pixel luminance change (0–255) below which a pixel is treated as noise.
pixel_difference_threshold = 20
# Proportion of changed pixels (0–1) above which the frame-to-frame change is
# "motion". Default 0.08 is based on real IMX708 production measurements (above
# quiet-scene variation, below clear controlled motion); per-site tuning may
# still be needed.
changed_pixel_ratio_threshold = 0.08
# Suppresses recording a repeated motion event that restarts within this window
# (seconds); the eventual return to no-motion is never hidden.
cooldown_seconds = 5.0
# Whole-frame change ceiling (0–1), Task 14.5. A frame-to-frame change above it
# is reported as "global_change" — an exposure or lighting step, a covered lens,
# a camera knock — never as motion, and it never triggers an automatic capture;
# the scene is re-baselined instead. Must be greater than
# changed_pixel_ratio_threshold. The detector also subtracts the mean luminance
# shift before scoring, so a uniform brightening below this ceiling reads as no
# motion rather than as activity. Default 0.5 ("a majority of the frame") is
# derived from the Task 14.4 measurements (whole-frame transitions of about
# 0.99 and 0.71) and is NOT field-calibrated; daylight commissioning may tune it.
global_change_ratio_threshold = 0.5

[event_capture]
# Motion-triggered still capture. Disabled by default: no worker is created, no
# trigger queue exists and no camera activity happens until this is explicitly
# enabled. When it IS enabled, a material transition into motion_detected may
# cause ONE full-resolution still capture through the existing camera
# coordinator, catalogued with the motion facts that triggered it.
#
# motion_detected still means "the scene changed", NOT "a bird is present" —
# event capture is simply another consumer of that signal. There is no
# detection, classification, species or confidence here.
#
# Enabling this requires camera.enabled, preview.enabled, preview.auto_start,
# preview.restore_after_capture and motion.enabled to all be true; asking for it
# with any of them off is rejected at load time. Each dependency is real:
# preview supplies the frames motion analyses, auto_start makes the pipeline
# survive a restart, and restore_after_capture returns the frame source after a
# capture has taken the camera.
#
# The queue holds exactly one pending trigger, there is no retry, and one
# transition produces at most one still. See docs/Event-Capture.md.
enabled = false
# Hard safety limits (Task 14.5). ALL THREE ARE MANDATORY when enabled = true;
# an enabled section missing any of them is rejected at load time. They are
# counted from the capture catalogue, so they survive a restart, and a trigger
# that would breach one creates no image, no catalogue row and no lifecycle
# row. Disabled here, they are inert; they are written out so an operator who
# enables the feature sees what the enablement requires.
#
# max_captures_per_hour   automatic captures admitted in any rolling 3600 s
#                         window (1–3600)
# max_captures_per_day    automatic captures admitted in the current UTC
#                         calendar day (1–86400)
# minimum_free_bytes      free space that must remain on the filesystem holding
#                         camera.capture_directory AFTER one more capture
# maximum_capture_bytes   the size reserved for one capture before admission and
#                         the largest file an automatic capture may publish
#                         (default 16 MiB; a larger still is refused and removed
#                         before it is catalogued)
#
# Manual capture (POST /camera/capture) applies no quota, but when a
# minimum_free_bytes floor is configured and the media filesystem is already
# below it, a manual capture is refused with HTTP 507 as well.
max_captures_per_hour = 20
max_captures_per_day = 120
minimum_free_bytes = 2147483648
maximum_capture_bytes = 16777216

[retention]
# Capture-media retention (Task 14.1). Disabled by default: no lifecycle row is
# written, no file is removed, no interrupted deletion is recovered and no
# retention observation is recorded until this is explicitly enabled.
#
# Nothing schedules retention. Task 14.1 builds the policy and the executor and
# deliberately does not arm them: there is no interval, no timer, no startup or
# shutdown deletion, and no destructive HTTP endpoint. GET /retention/status is
# read-only and inert. How retention is invoked operationally is a later
# decision. See docs/Retention.md.
#
# Only automatic captures — those catalogued with origin = "motion" by
# [event_capture] — are managed. Manual captures, captures with no origin and
# captures from any origin this build does not recognise are PROTECTED and are
# never selected.
enabled = false
# Age bound: managed captures older than this are eligible. Left commented,
# because there is no safe guessed retention period — an operator who wants one
# writes it down. At least one of max_age_days / max_managed_bytes is REQUIRED
# when enabled = true; enabling with neither is rejected at load time.
# max_age_days = 30
# Managed-byte bound: the total catalogued size of PRESENT managed captures.
# It measures the media the automatic capture feature generates — not manual
# captures, not the database, not the logs and not filesystem utilisation.
# max_managed_bytes = 2147483648
# Safety bounds rather than policy. The newest minimum_keep_count managed
# captures are preserved unconditionally, whatever the bounds above would say;
# the floor is never traded away to meet a byte target. max_deletions_per_run is
# the hard ceiling on how many captures ONE run may newly select for deletion.
minimum_keep_count = 100
max_deletions_per_run = 25

[notifications]
# Notification framework. Disabled by default: no provider is constructed and
# every published event is dropped until this is explicitly enabled. Only the
# transport-free providers exist so far — "log" (writes events to the
# application log, for validation) and "null" (accepts and discards events).
# Telegram/email/SMS are future work; their settings do NOT belong here yet.
enabled = false
provider = "log"

[database]
# SQLite runtime settings. The database LOCATION is not here — it is
# [storage].database_path, the single source of truth for that path.
#
# The schema is versioned by ordered SQL migrations under migrations/, applied
# automatically at startup. See docs/Database.md.
#
# How often the background monitor runs the read-only health check (seconds).
health_check_interval_seconds = 60
# Finite time SQLite waits for a competing writer's lock before failing with
# "database is locked". A bound, never a retry loop.
busy_timeout_seconds = 5.0

[health]
enabled = true
collection_interval_seconds = 60
temperature_warning_celsius = 70.0
temperature_critical_celsius = 80.0
disk_warning_percent = 80.0
disk_critical_percent = 90.0
memory_warning_percent = 85.0
memory_critical_percent = 95.0
